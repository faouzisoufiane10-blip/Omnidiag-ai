version: '3.8'

services:
  # ---------------------------------------------------------
  # 1. EVENT STREAMING (Telemetry Data Backbone)
  # ---------------------------------------------------------
  kafka:
    image: bitnami/kafka:latest
    container_name: omnidiag_kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    ports:
      - "9092:9092"
    networks:
      - omnidiag_net
    restart: unless-stopped

  # ---------------------------------------------------------
  # 2. VECTOR DATABASE (For AI RAG - Repair Manuals Search)
  # ---------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: omnidiag_vector_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - omnidiag_net
    restart: unless-stopped

  # ---------------------------------------------------------
  # 3. RELATIONAL DATABASE (Users, Logs, Vehicle Profiles)
  # ---------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: omnidiag_rdbms
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=enterprise_secure_pwd
      - POSTGRES_DB=omnidiag
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - omnidiag_net
    restart: unless-stopped

  # ---------------------------------------------------------
  # 4. REDIS (Caching for High-Speed Live Data)
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: omnidiag_cache
    ports:
      - "6379:6379"
    networks:
      - omnidiag_net
    restart: unless-stopped

networks:
  omnidiag_net:
    driver: bridge

volumes:
  qdrant_storage:
  pg_data:
